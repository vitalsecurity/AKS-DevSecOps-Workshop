name: Build and Deploy AKS

on:
  push:
    branches:
      - main
    paths:
      - 'tools/deploy/module0/**'
  workflow_dispatch:

env:
  CLUSTER_RESOURCE_GROUP: ${{ secrets.CLUSTER_RESOURCE_GROUP }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

permissions:
  id-token: write   # Required for OIDC login
  contents: read    # Required for checkout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0

      - name: Azure login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy AKS via Bicep
        uses: azure/arm-deploy@v1
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ secrets.CLUSTER_RESOURCE_GROUP }}
          template: tools/deploy/module0/aks.bicep
          failOnStdErr: false

      - name: Attach ACR to AKS
        run: |
          CLUSTER_NAME=$(az aks list \
            --resource-group ${{ secrets.CLUSTER_RESOURCE_GROUP }} \
            --query "[].name" -o tsv)
          ACR_NAME=$(az acr list \
            --resource-group ${{ secrets.CLUSTER_RESOURCE_GROUP }} \
            --query "[].name" -o tsv)
          az aks update -n $CLUSTER_NAME \
            -g ${{ secrets.CLUSTER_RESOURCE_GROUP }} \
            --attach-acr $ACR_NAME
